<li class ="border p-2 m-2">
      <span [style.textDecoration]="todo().status?'line-through':''">{{todo().title}}</span>
      @if(todo().status){
      <button class="btn btn-info mx-2" (click)="togStatus(i())">Not Done</button>

      }
      @else {
      <button class="btn btn-warning mx-2" (click)="togStatus(i())"> Done</button>
      }
      <button (click)="delTodo(i())" class="btn btn-danger mx-2">Delete</button>
      
    </li>
